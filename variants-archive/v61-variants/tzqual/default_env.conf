# tzqual — 画质优先版的内置默认环境变量
# 由 20-default-env.py 在编译期烤进驱动；app 或 debug.mesa.* 设置的同名变量优先级更高。
# 不写 TU_Z_TEXFAST=1，纹理采样保持上游行为（各向异性 + mip 正常）。

# 可变格式/压缩 swapchain 的 BGRA 实色交换（33 + 37 配套），v5.1 已有，保留
TU_Z_BGRA_SWAP=1

# 渲染过程中整幅深度清屏时保留 LRZ（需要 TU_DEBUG=sysmem 才真正生效，本变体不强制 sysmem）
TU_Z_LRZ_RESCUE=1

# 显式封住 texfast，防止上游把默认值改成开
TU_Z_TEXFAST=0
TU_Z_TEXMIP=0
TU_Z_LODBIAS=0

# v6.1：显存模式回到上游 BANDWIDTH（36 号补丁已停用）
TU_AUTOTUNE_ALGO=bandwidth
# v6.1：GPU 一直在最高频会让机身先热、长测被 thermal 降频；想对比就改成 0
TU_KGSL_GOVERNOR_OFF=1
