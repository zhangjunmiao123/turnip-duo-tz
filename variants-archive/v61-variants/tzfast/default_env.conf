# tzfast — 帧数优先版：把纹理带宽压到极限（画质会明显下降）
# 对应 TurnipZ 的核心省钱手段：关各向异性、mip 取最近、额外 LOD 偏置。
#
# 注意这是 v6.0 那套"三件套"的显式版本——它会让远景草地/地面出现 mip 跳变
# （观感上就是抖动/发毛）。日常玩用 tzeden；只有当 tzeden 在这款游戏上确实
# 卡在带宽上、并且你能接受这个画质损失时，才换这个包。

TU_AUTOTUNE_ALGO=bandwidth
TU_KGSL_GOVERNOR_OFF=1

# 总开关
TU_Z_TEXFAST=1
# 关各向异性 + mip 取最近（画质代价的主要来源）
TU_Z_TEXMIP=1
# 额外 LOD 偏置，单位 1/100。45 = TurnipZ 原值；
# 嫌远景糊就降到 20，嫌不够快可以到 60（再高会出现明显纹理跳变）
TU_Z_LODBIAS=45

TU_Z_BGRA_SWAP=1
TU_Z_LRZ_RESCUE=1
