name: Build Turnip Duo TZ

# 只出一个东西：可安装的 AdrenoTools 驱动 zip（artifacts 里下载）。
# 不建 release、不打 tag、不需要写权限，fork 到自己账号下即可跑。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，只用于 zip 名和 meta.json（例：6.1）'
        type: string
        default: '6.2'
      variants:
        description: '要构建的变体，空格分隔；all = base + patches/variants 下全部'
        type: string
        default: 'tz5 tz5s'
      mesa_ref:
        description: 'Mesa 分支/标签/提交（默认 v5.1 用的那个提交）'
        type: string
        default: '74920caaa0bed55313e7af00036c61515621913b'
      cpu_flags:
        description: '仅 CPU 侧（命令录制 + 着色器编译）编译参数，留空 = 不优化'
        type: string
        default: '-march=armv8.2-a'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_TARGET: android
      BUILD_VARIANTS: ${{ inputs.variants }}
      MESA_REF: ${{ inputs.mesa_ref }}
      NDK_VERSION: android-ndk-r29
      # 清空 runner 自带的 NDK，强制使用上面这个版本
      ANDROID_NDK_HOME: ''
      ANDROID_CPU_FLAGS: ${{ inputs.cpu_flags }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      DRIVER_NAME: 'Turnip Duo TZ'
      DRIVER_DESCRIPTION: 'Turnip for Retroid Pocket Duo (Adreno 722), Turnip-Z patch set with pinned defaults'
      DRIVER_AUTHOR: 'vauzi, sherft2607, TZ variant tuning'
      ZIP_PREFIX: 'Turnip-Duo-TZ'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison glslang-tools ninja-build ccache zip unzip \
            pkg-config patch python3-pip
          sudo python3 -m pip install --quiet --break-system-packages meson mako packaging pyyaml
          meson --version

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: turnip_workdir/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-tz-${{ github.run_id }}
          restore-keys: ccache-tz-

      - name: Build
        run: |
          set -o pipefail
          bash ./turnip_builder.sh 2>&1 | tee build-tz.log

      # 关键防线：没有真正编出 .so 就必须失败，不能"绿着交付空包"。
      # 同时把日志尾部写进 Summary，便于远程定位（无需下载 artifact）。
      - name: Verify build outputs
        if: always()
        run: |
          {
            echo "### 输出目录 out/"
            echo '```'
            ls -la out/ 2>/dev/null || echo "(out/ 不存在)"
            echo '```'
            echo
            echo "### 日志尾部（最后 120 行）"
            echo '```'
            tail -n 120 build-tz.log 2>/dev/null || echo "(无 build-tz.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          zips=(out/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::没有产出任何驱动 zip，编译未完成"
            exit 1
          fi

          fail=0
          for z in "${zips[@]}"; do
            bytes=$(stat -c%s "$z")
            so=$(unzip -l "$z" 2>/dev/null | awk '$NF ~ /\.so$/ {print $1; exit}')
            echo "检查 $z：zip=${bytes} bytes，内含 .so=${so:-无}"
            if [ -z "${so:-}" ]; then
              echo "::error::$z 里没有 .so"
              fail=1
            elif [ "$so" -lt 1000000 ]; then
              echo "::error::$z 的 .so 只有 $so bytes（<1 MiB），不是有效驱动"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "全部 ${#zips[@]} 个包校验通过"

      - name: Summary (每个补丁是 applied 还是 no-change)
        if: always()
        run: |
          {
            echo "### Turnip Duo TZ ${{ inputs.version }}"
            echo
            if [ -f out/build-info.env ]; then
              grep -E '^(MESA_COMMIT|MESA_VERSION|VULKAN_VERSION)=' out/build-info.env | sed 's/^/- /'
            fi
            echo
            for f in out/patches-*.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$(basename "$f" .txt | sed 's/patches-//')</summary>"
              echo
              echo '```'
              awk -F'\t' '{printf "%-42s %s\n", $1, $2}' "$f"
              echo '```'
              echo "</details>"
            done
            echo
            ls -lh out/*.zip 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload driver zips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnip-duo-tz-${{ inputs.version }}
          path: |
            out/*.zip
            out/patches-*.txt
            out/build-info.env
            build-tz.log
          if-no-files-found: error
