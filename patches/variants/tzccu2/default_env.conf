# tzccu2 — 单变量对照：num_ccu=2 / tile_align_h=32
# 目的：v5.1 把 A722 钉死成 num_ccu=1 / tile_align_h=16（57 号补丁 EXPECT=(1,16)），
# 而同仓库另一条流水线（build-turnip.yml）用的是 num_ccu=2 / tile_align_h=32。
# 这两套互相矛盾，谁对只能用实测决定：值本身相当于把 bin 的像素块尺寸写进寄存器，
# 配错了要么并行度浪费一半，要么画面撕裂出条带。
# 其余参数与 tzqual 完全一致，保证只差这一个变量。

TU_Z_BGRA_SWAP=1
TU_Z_LRZ_RESCUE=1
TU_Z_TEXFAST=0
