# tzeden — 面向 Eden（Switch 模拟器）在 RP Duo / Adreno 722 上的调校版
#
# 设计前提（都是量出来的，不是猜的）：
#   * 设备内存是 LPDDR4X（8GB），不是 Q-7790 规格书写的 LPDDR5X。
#     双 16-bit @4266 MT/s ≈ 34.1 GB/s，和 865 掌机同一水位。
#     而 3DMark Wild Life Extreme 上 Duo 是 1721、865 机是 1332（+29%）。
#     → GPU 算力有余、内存带宽吃紧。优化必须往「少读显存」走，不是往「多算」走。
#   * Switch 便携模式渲染 720p，贴图以 ASTC 为主，Eden 每帧纹理采样量很大。
#
# 关键取舍：这里故意 **不设 TU_DEBUG**。
#   Eden 从 2026-01 起支持在图形设置里配 Turnip 环境变量，且优先级高于本文件的
#   内置默认值（20-default-env.py 用 setenv(...,0)，已设置的变量不覆盖）。
#   所以 gmem / sysmem 两种显存模式留给你在 Eden 里现场切，不用重刷驱动。

# ---- 纹理带宽：Eden 上真正省钱的一条 ----
# 关各向异性 + mip 取最近 + LOD 偏置。
# 注意：Eden 自己的「各向异性过滤」默认就是关，所以 aniso=0 在 Eden 里基本是空操作；
#       真正起作用的是 miplinear=false —— 三线性要采两个 mip 再插值，最近只采一个，
#       小尺寸贴图密集的场景（Switch 游戏的大头）纹理取数直接少一半。
TU_Z_TEXFAST=1

# LOD 偏置，单位 1/100。TurnipZ 原值 45，这里收到 30：
# 5.5 寸 1080p 屏上 +0.45 的远景糊是看得出来的，+0.30 是画质与带宽的平衡点。
# 想更锐利改 15，想更省带宽改 45（在 Eden 驱动设置里覆盖即可，不必重编）。
TU_Z_LODBIAS=30

# ---- 交换链格式：省一次全屏 blit ----
# Eden 的 surface 是 B8G8R8A8，若驱动侧再转一次格式，等于每帧多读写一遍全屏。
# 33 + 37 让 BGRA 走实色交换，配合基线的 30 号（保 TILE6_3 + UBWC 的压缩交换链）。
TU_Z_BGRA_SWAP=1

# ---- LRZ：只在 sysmem 模式下才真正生效 ----
# 渲染中途整幅深度清屏时保留 LRZ，避免后续几何被错误剔除/白算。
# 这条在 gmem 模式下是惰性的，留着不影响性能。
TU_Z_LRZ_RESCUE=1
