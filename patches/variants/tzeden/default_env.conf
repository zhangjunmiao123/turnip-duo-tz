# tzeden — v6.1「复位版」：先回到上游画质，再逐项往上加
#
# v6.0 在荒野之息上的两个症状，现在都定位到了具体补丁，处理方式写在这里：
#
#   症状一：帧数更低
#     → 36 号补丁把 tu_autotune 的编译期默认改成 PREFER_SYSMEM，而
#       PREFER_SYSMEM 在 get_optimal_mode() 里是**提前返回**，等于所有 render
#       pass 一律走系统内存；同时 17 号脚本因为 BUILD_VARIANT 回退成 "p2"，
#       把带宽乘数从 11 改成了 10（那一改让 gmem_bandwidth 变成累加，GMEM 永远
#       显得更贵），等于又压了一道。两个机制叠加 = 100% sysmem 渲染。
#       Duo 的带宽只有 ~17 GB/s，双屏 120Hz 还要扣掉 1.58 GB/s，把整帧颜色和
#       深度全压到 DDR 上，是纯反向优化。
#     → v6.1：36 号停用（.off），17 号只在显式请求 p/p1/p2 时生效，
#       autotune 回到上游 BANDWIDTH，逐个 render pass 自己算。
#
#   症状二：边缘锯齿严重
#     → 32 号补丁除了加 LOD 偏置，还把 miplinear 设成 false（三线性 → 最近 mip）
#       并把 aniso 归零。v5.1 只加 LOD 偏置，从不动这两项。mip 之间直接跳变，
#       远景草地/地面在移动时抖动发毛，看起来就是锯齿。
#     → v6.1：miplinear/aniso 拆到 TU_Z_TEXMIP 后面（默认 0 = 不动），
#       LOD 偏置默认 0 = 不动。默认状态下采样器与上游逐 bit 相同。
#
# 下面每个变量都可以在 Eden → 设置 → 图形 → 驱动设置里现场覆盖，不用重刷驱动。

# 显存模式：回到上游 BANDWIDTH（按估算带宽逐个 render pass 选 GMEM/sysmem）。
# 想要 v5.1 那种"一律 sysmem"，把这里改成 prefer_sysmem；
# 想让 autotune 更激进地选 GMEM，改成 profiled，或配合 TU_AUTOTUNE_FLAGS=big_gmem。
# 注意：本变体的 FD722 几何是 1/16/15，TU_DEBUG=gmem 会花屏，别设。
TU_AUTOTUNE_ALGO=bandwidth

# GPU 调频：关掉 KGSL governor → 钉最高频（v5.1 行为，默认开）。
# 觉得机身烫、或者长测（>10 分钟）帧数反而往下掉，改成 0 交回系统 governor。
TU_KGSL_GOVERNOR_OFF=1

# ---- 纹理采样（v6.1 默认全部等同上游）----
# 总开关，留着；真正的行为由下面两个变量决定
TU_Z_TEXFAST=1
# 最近 mip + 关各向异性。0 = 上游三线性（画质最好）；1 = v6.0 的省带宽做法
TU_Z_TEXMIP=0
# 额外 LOD 偏置，单位 1/100。0 = 不加偏置；想省带宽换远景糊就从 20 往上试
TU_Z_LODBIAS=0

# ---- 交换链与 LRZ ----
# 可变格式/压缩 swapchain 的 BGRA 实色交换（33 + 37 配套），v5.1 已有，保留。
# 万一出现红蓝互换/整屏偏色，先改成 0。
TU_Z_BGRA_SWAP=1
# 渲染中途整幅深度清屏时保留 LRZ。只在 TU_DEBUG=sysmem 下真正生效，默认留着无害。
TU_Z_LRZ_RESCUE=1
