# tzsys — 单变量对照：强制 sysmem 渲染，解锁 LRZ rescue
# 目的：验证 TurnipZ "sysmem 渲染" 这条路在 A722（片上 GMEM 只有 1 MiB）上到底值不值。
# 注意：TU_DEBUG=sysmem 会覆盖 tu_autotune 的 GMEM/sysmem 自动选择。
# 如果这个变体赢了，说明 1 MiB GMEM 走 GMEM 路径纯粹是自找带宽抖动。

TU_DEBUG=sysmem

# 打开 LRZ rescue —— 它只在 TU_DEBUG=sysmem 时才真正生效
TU_Z_LRZ_RESCUE=1

TU_Z_BGRA_SWAP=1
TU_Z_TEXFAST=0
TU_Z_TEXMIP=0
TU_Z_LODBIAS=0

# v6.1：这个变体本来就是"强制 sysmem"的对照组，所以 autotune 也钉到 prefer_sysmem，
# 保证 TU_DEBUG=sysmem 被清掉时行为仍然一致（36 号补丁已停用，改由运行时变量承担）
TU_AUTOTUNE_ALGO=prefer_sysmem
TU_KGSL_GOVERNOR_OFF=1

