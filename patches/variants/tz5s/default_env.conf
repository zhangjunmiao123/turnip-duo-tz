# tz5 — 帧率优先主线（v6.2）：逐项对齐 v5.1，再只叠加纯省带宽的纹理项
#
# 背景：tzeden / tzfast（v6.1）实测都比 v5.1 慢。逐项对照后找到了 v6.0/v6.1
# 共同引入、而 v5.1 没有的负重，本变体把它们全部去掉：
#
#   1. 56 号把 enable_tp_ubwc_flag_hint 设成了 False —— 纹理处理器不再吃
#      UBWC flag 提示，压缩纹理取数退回低压缩路径，带宽直接变大。
#      这台机器只有 ~17 GB/s，贴图密集的游戏（荒野之息）最先爆。
#      → 59 号补丁恢复上游默认（True），同时 has_lpac 也恢复。
#   2. 56 号把 raw_magic_regs 从 v5.1 的 a730_raw_magic_regs 换成了自造的
#      a722_raw_magic_regs。这类寄存器写错不花屏，只表现为帧率差异。
#      → 59 号恢复 a730。
#   3. 33/37 号全局 BGRA 实色交换、31 号 LRZ rescue：v5.1 都没有。
#      → 本变体不带这几个补丁。
#   4. v6.1 放开了 GMEM（autotune BANDWIDTH + 2/32/16 几何），实测更慢。
#      → 35b 号按 v5.1 的做法在 use_sysmem_rendering 里把 A722 钉回 sysmem，
#        几何回设备真值 1/16/15（sysmem 下近乎惰性）。
#
# 相对 v5.1 的唯一增量：32 号 texfast 以「省带宽」档启用（TEXMIP=1 + LODBIAS=45）。
# 你已确认锯齿不重要，这两项都是纯省带宽。
#
# 下面每个变量都可以在 Eden → 设置 → 图形 → 驱动设置里现场覆盖，不用重刷驱动。

# 双保险：autotune 也倾向 sysmem（35b 号已在渲染模式决策层钉死，
# 这里只是让 autotune 内部统计口径一致）。
TU_AUTOTUNE_ALGO=prefer_sysmem

# GPU 调频：关掉 KGSL governor → 钉最高频（v5.1 行为）。
# 机身烫或长测（>10 分钟）帧数往下掉，改成 0 交回系统 governor。
TU_KGSL_GOVERNOR_OFF=1

# ---- 纹理采样：帧率优先，画质让路 ----
# 总开关
TU_Z_TEXFAST=1
# 关各向异性 + mip 取最近（省带宽的主要来源，远景会抖动发毛——已知代价）
TU_Z_TEXMIP=1
# 额外 LOD 偏置，单位 1/100。45 = TurnipZ 原值；嫌糊降到 20
TU_Z_LODBIAS=45

# ---- 逃生开关 ----
# 设 1 可以在运行时走回 GMEM/autotune 路径做 A/B 对比，不用重编
# TU_Z_FORCE_GMEM=0

# ---- tz5s 相对 tz5 的差异：以下两项保留（v6.0 的新增项，用于对照）----
# BGRA 实色交换（33+37 配套）
TU_Z_BGRA_SWAP=1
# 渲染中途整幅深度清屏时保留 LRZ
TU_Z_LRZ_RESCUE=1
