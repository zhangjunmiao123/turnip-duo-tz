# tzfast — 帧数优先版的内置默认环境变量
# 对应 TurnipZ 的核心省钱手段：关各向异性、mip 取最近、额外 LOD 偏置，换纹理带宽。

# 打开 texfast（32-tu-z-texfast.py 的开关）
TU_Z_TEXFAST=1

# 额外 LOD 偏置，单位 1/100。45 = +0.45，TurnipZ 的原值；
# 嫌远景糊就调到 20，嫌不够快可以到 60（再高会出现明显纹理跳变）
TU_Z_LODBIAS=45

# 可变格式/压缩 swapchain 的 BGRA 实色交换（33 + 37），必须和上面的 tiled/UBWC 路径配套
TU_Z_BGRA_SWAP=1

# 渲染过程中整幅深度清屏时保留 LRZ
TU_Z_LRZ_RESCUE=1
